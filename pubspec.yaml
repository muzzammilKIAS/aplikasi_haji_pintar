name: aplikasi_haji_pintar
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  pdf: ^3.13.0
  printing: ^5.15.0
  audioplayers: ^6.8.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  hijri: ^3.0.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  peanut: ^4.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/maps/
    - assets/audio/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

